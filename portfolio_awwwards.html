<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>João Pedro — Portfólio Luxury Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body{background:#050505}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:soft-light;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><filter id="n"><feTurbulence baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.5"/></svg>')}
  .text-gold-outline{-webkit-text-stroke:1px #9d7f3f;color:transparent;transition:all .6s}
  .text-gold-outline:hover{color:#9d7f3f;-webkit-text-stroke:0}
  .glass{backdrop-filter:blur(16px);background:rgba(255,255,255,.03);border:1px solid rgba(157,127,63,.15)}
  .glow{box-shadow:0 0 80px rgba(157,127,63,.15)}
</style>
</head>
<body class="bg-[#050505] text-white selection:bg-[#9d7f3f]/30">
<div class="grain"></div>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useRef} = React;
function App(){
  const heroRef=useRef();
  useEffect(()=>{
    const el=heroRef.current;
    const onMove=e=>{
      const r=el.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-0.5;
      const y=(e.clientY-r.top)/r.height-0.5;
      el.style.setProperty('--mx',x);
      el.style.setProperty('--my',y);
    };
    el.addEventListener('mousemove',onMove);
    return()=>el.removeEventListener('mousemove',onMove);
  },[]);
  return (
    <div className="relative min-h-screen overflow-x-hidden">
      <header className="fixed top-0 w-full z-50 border-b border-white/5 backdrop-blur-xl bg-[#050505]/70">
        <div className="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
          <div className="text-sm tracking-[0.2em]">JOÃO PEDRO<span className="text-[#9d7f3f]">.</span></div>
          <nav className="text-xs tracking-widest text-gray-400">SOBRE • PROJETOS • CONTATO</nav>
        </div>
      </header>
      <section ref={heroRef} className="relative h-[100vh] flex items-center justify-center overflow-hidden">
        <div className="absolute inset-0 opacity-[0.15]">
          <div className="absolute w-[600px] h-[600px] rounded-full blur-[120px] bg-[#9d7f3f]/20 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2" style={{transform:`translate(calc(-50% + ${'var(--mx,0)'}*40px), calc(-50% + ${'var(--my,0)'}*40px))`}}/>
        </div>
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div className="w-24 h-24 border border-white/5 rotate-45"/>
          <div className="w-16 h-16 border border-[#9d7f3f]/20 rounded-full absolute top-1/4 left-1/4"/>
          <div className="w-12 h-12 border border-white/5 rounded-[30%] absolute bottom-1/3 right-1/4"/>
        </div>
        <h1 className="relative text-center leading-[0.85]">
          <span className="block text-[clamp(64px,22vw,220px)] font-black tracking-tighter text-gold-outline">JOÃO</span>
          <span className="block text-[clamp(48px,16vw,160px)] font-light tracking-[-0.04em] text-white/90">PEDRO DA SILVA</span>
        </h1>
        <div className="absolute bottom-12 text-center w-full text-xs tracking-[0.3em] text-gray-500">CIÊNCIA DA COMPUTAÇÃO • FECAP • LUXURY TECH PORTFOLIO</div>
      </section>
      <section className="max-w-7xl mx-auto px-8 py-24">
        <h2 className="text-[10px] tracking-[0.4em] text-[#9d7f3f] mb-12">SELEÇÃO DE TRABALHOS</h2>
        <div className="grid grid-cols-12 gap-6 auto-rows-[220px]">
          <div className="col-span-12 md:col-span-8 row-span-2 glass rounded-[28px] p-8 glow hover:scale-[1.01] transition-transform duration-700">
            <div className="text-xs text-[#9d7f3f] tracking-widest mb-3">PROJETO PRINCIPAL</div>
            <h3 className="text-4xl font-semibold mb-4">AlinhaPlus</h3>
            <p className="text-gray-300 max-w-xl">Banco de dados acadêmico na nuvem com SQLite Cloud e deploy na Vercel. Arquitetura serverless, latência mínima e sincronização em tempo real.</p>
            <div className="mt-6 flex gap-2 text-[10px] tracking-widest text-gray-400"><span className="border border-[#9d7f3f]/40 px-3 py-1 rounded-full">SQLITE</span><span className="border border-[#9d7f3f]/40 px-3 py-1 rounded-full">VERCEL</span><span className="border border-[#9d7f3f]/40 px-3 py-1 rounded-full">CLOUD</span></div>
          </div>
          <div className="col-span-12 md:col-span-4 glass rounded-[28px] p-8 hover:scale-[1.01] transition-transform duration-700">
            <div className="text-xs text-[#9d7f3f] tracking-widest mb-3">INTEGRADOR</div>
            <h3 className="text-2xl font-semibold">WebCrawlers</h3>
            <p className="text-gray-400 text-sm">Raspagem de dados em grupo. Pipeline de extração, limpeza e visualização.</p>
          </div>
          <div className="col-span-12 md:col-span-4 row-span-2 glass rounded-[28px] p-8 hover:scale-[1.01] transition-transform duration-700">
            <div className="text-xs text-[#9d7f3f] tracking-widest mb-3">PESQUISA</div>
            <h3 className="text-2xl font-semibold">Loot Boxes</h3>
            <p className="text-gray-400 text-sm">Análise semiótica e ética de mecânicas de monetização em videogames.</p>
          </div>
          <div className="col-span-12 md:col-span-8 glass rounded-[28px] p-8 flex items-end justify-between hover:scale-[1.01] transition-transform duration-700">
            <div>
              <div className="text-xs text-[#9d7f3f] tracking-widest mb-2">CONTATO</div>
              <div className="text-3xl font-light">Vamos criar algo imersivo?</div>
            </div>
            <a href="mailto:joao.pedro@email.com" className="text-xs tracking-widest border border-[#9d7f3f]/60 px-4 py-2 rounded-full hover:bg-[#9d7f3f]/10 transition">ESCREVER</a>
          </div>
        </div>
      </section>
      <footer className="border-t border-white/5 py-16 text-center text-[10px] tracking-widest text-gray-600">
        © 2025 JOÃO PEDRO DA SILVA • FECAP • PORTFÓLIO PREMIUM
      </footer>
    </div>
  )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
